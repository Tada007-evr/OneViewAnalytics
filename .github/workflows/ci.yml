name: OneView CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Streamlit application
        run: python -m py_compile app/main.py app/oneview_db.py app/overview_page.py app/overview_page_brd.py app/record_page.py app/record_page_brd.py app/topic_page.py app/bi_components.py

      - name: Run Record Practice Paper unit tests
        run: python -m unittest tests/test_record_practice.py -v

      - name: Validate required release files
        run: |
          test -f sql/01_schema.sql
          test -f sql/03_bi_views.sql
          test -f sql/07_record_practice_brd_v1.sql
          test -f sql/08_release_hardening.sql
          test -f sql/09_overview_dashboard_brd_v1_6.sql
          test -f sql/10_overview_insight_recommendation_bi.sql
          test -f sql/11_record_practice_paper_brd_v1_0.sql
          test -f sql/12_final_paper1_import_support.sql
          test -f sql/13_validate_final_paper1_load.sql
          test -f metabase/OVERVIEW_DASHBOARD_QUERIES.sql
          test -f metabase/POWER_BI_STYLE_GUIDE.md
          test -f data/OneView_9709_Paper1_2025_Mapping-Score.xlsx
