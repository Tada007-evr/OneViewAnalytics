name: OneView CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Streamlit application
        run: python -m py_compile app/main.py

      - name: Validate required release files
        run: |
          test -f sql/01_schema.sql
          test -f sql/03_bi_views.sql
          test -f sql/07_record_practice_brd_v1.sql
          test -f data/OneView_9709_Paper1_2025_Mapping-Score.xlsx
